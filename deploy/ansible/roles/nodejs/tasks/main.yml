---
- name: Add the NodeSource signing key
  ansible.builtin.get_url:
    url: "{{ nodejs_repo_key_url }}"
    dest: /etc/apt/keyrings/nodesource.asc
    mode: "0644"

- name: Add the NodeSource repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ nodejs_major_version }}.x nodistro main"
    filename: nodesource
    state: present

# Pin NodeSource above Debian's own nodejs package.
- name: Prefer NodeSource packages
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/nodesource
    content: |
      Package: nodejs
      Pin: origin deb.nodesource.com
      Pin-Priority: 600
    mode: "0644"

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present
