---
- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

- name: Configure swap
  ansible.builtin.include_tasks: swap.yml
  when:
    - common_swap_size_mb | int > 0
    - ansible_virtualization_type not in ['docker', 'container', 'podman', 'lxc']

- name: Install the SSM agent
  ansible.builtin.include_tasks: ssm_agent.yml
  when: common_install_ssm_agent | bool

- name: Create the service users
  ansible.builtin.user:
    name: "{{ item }}"
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false
  loop:
    - "{{ app_api_user }}"
    - "{{ app_billing_user }}"

- name: Create the runtime config directory
  ansible.builtin.file:
    path: "{{ app_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Create the application root
  ansible.builtin.file:
    path: "{{ app_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
