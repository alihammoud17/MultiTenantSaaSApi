---
- name: Create the release directory
  ansible.builtin.file:
    path: "{{ api_release_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Unpack the API release
  ansible.builtin.unarchive:
    src: "{{ api_artifact }}"
    dest: "{{ api_release_dir }}"
    owner: root
    group: root
    creates: "{{ api_release_dir }}/Presentation.dll"

# Read by systemd (as root) only, so the service user needs no access to it.
- name: Write the API environment file
  ansible.builtin.template:
    src: api.env.j2
    dest: "{{ api_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart api

# Runs before the switch so a failed migration leaves the previous release serving.
# The bundle reads the connection string from the same configuration keys as the API.
- name: Apply database migrations
  ansible.builtin.command:
    cmd: ./efbundle
    chdir: "{{ api_release_dir }}"
  environment: "{{ {'ConnectionStrings__DefaultConnection': api_connection_string, 'DOTNET_CLI_TELEMETRY_OPTOUT': '1'} | combine(api_extra_environment) }}"
  register: api_migrations
  changed_when: "'No migrations were applied' not in api_migrations.stdout"
  no_log: true

- name: Point current at the release
  ansible.builtin.file:
    src: "{{ api_release_dir }}"
    dest: "{{ api_home }}/current"
    state: link
    force: true
  notify: Restart api

- name: Install the API unit
  ansible.builtin.template:
    src: mtsaas-api.service.j2
    dest: /etc/systemd/system/{{ api_service }}.service
    mode: "0644"
  notify: Restart api

- name: Start the API
  ansible.builtin.systemd_service:
    name: "{{ api_service }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Restart the API if the release, unit or config changed
  ansible.builtin.meta: flush_handlers

- name: Wait for the API to report healthy
  ansible.builtin.uri:
    url: http://127.0.0.1:{{ app_api_port }}/health
    status_code: 200
  register: api_health
  until: api_health.status == 200
  retries: "{{ api_health_retries }}"
  delay: 2
