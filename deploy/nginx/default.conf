server {
  listen 80;
  server_name _;

  location /billing/ {
    proxy_pass http://billing:3001/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Internal service and operator endpoints (billing callback, tenant suspension) are not public.
  # Callers use the API on the Compose network (http://api:8080). Case-insensitive because ASP.NET routing is.
  location ~* ^/api/internal(/|$) {
    return 403;
  }

  location / {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
